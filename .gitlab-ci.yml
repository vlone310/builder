# CI for self-hosted GitLab with the Docker executor. Setup: docs/gitlab-ci.md.
#
#   check   lint, typecheck, unit and integration tests, build
#   images  build every deployable, migrate a fresh database from the service images,
#           start each image and check it answers, then push it to Harbor
#   e2e     Playwright against the apps, with Keycloak from the image built above

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request runs as the merge request pipeline only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - images
  - e2e

variables:
  NODE_IMAGE: node:22-bookworm
  POSTGRES_IMAGE: postgres:16.15
  DOCKER_VERSION: "28.5.1"
  # Harbor project the images go to; HARBOR_HOST and HARBOR_PROJECT are CI/CD variables.
  IMAGE_PREFIX: ${HARBOR_HOST}/${HARBOR_PROJECT}
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

default:
  interruptible: true

.pnpm:
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile

check:
  extends: .pnpm
  stage: test
  needs: []
  image: $NODE_IMAGE
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
      variables:
        POSTGRES_USER: builder
        POSTGRES_PASSWORD: builder
        POSTGRES_DB: builder_test
  variables:
    TEST_DATABASE_URL: postgres://builder:builder@postgres:5432/builder_test
  script:
    - pnpm lint
    - pnpm turbo run typecheck test build

images:
  stage: images
  needs: []
  image: docker:$DOCKER_VERSION
  services:
    - name: docker:$DOCKER_VERSION-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE: $IMAGE_PREFIX/$NAME
    IMAGE_REF: $IMAGE_PREFIX/$NAME:$CI_COMMIT_SHA
  parallel:
    matrix:
      - NAME: content-api
        DOCKERFILE: Dockerfile
        CONTEXT: .
        SERVICE: content-api
        APP_PORT: "4000"
        CHECK: /health
      - NAME: delivery-api
        DOCKERFILE: Dockerfile
        CONTEXT: .
        SERVICE: delivery-api
        APP_PORT: "4001"
        CHECK: /health
      - NAME: worker
        DOCKERFILE: Dockerfile
        CONTEXT: .
        SERVICE: worker
        APP_PORT: "4002"
        CHECK: /health
      - NAME: sample-host
        DOCKERFILE: apps/sample-host/Dockerfile
        CONTEXT: .
        APP_PORT: "3000"
        CHECK: /api/builder/revalidate
      - NAME: editor
        DOCKERFILE: apps/editor/Dockerfile
        CONTEXT: .
        APP_PORT: "8080"
        CHECK: /config.js
      - NAME: keycloak
        DOCKERFILE: infra/keycloak/Dockerfile
        CONTEXT: infra/keycloak
  before_script:
    - apk add --no-cache curl
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_HOST" -u "$HARBOR_USER" --password-stdin
    # The docker-container driver can export the build cache to Harbor.
    - docker buildx create --use --driver docker-container
  script:
    - >
      docker buildx build --load
      --file "$DOCKERFILE"
      ${SERVICE:+--build-arg SERVICE=$SERVICE}
      --cache-from "type=registry,ref=$IMAGE:buildcache"
      --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
      --tag "$IMAGE_REF"
      "$CONTEXT"
    - scripts/ci/smoke-image.sh
    # Only images that started and answered are pushed.
    - docker push "$IMAGE_REF"
    - |
      for tag in ${CI_COMMIT_TAG:-} $([ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && echo "$CI_DEFAULT_BRANCH"); do
        docker tag "$IMAGE_REF" "$IMAGE:$tag"
        docker push "$IMAGE:$tag"
      done

e2e:
  extends: .pnpm
  stage: e2e
  # Waits only for the Keycloak image, which the browser signs in against.
  needs:
    - job: images
      parallel:
        matrix:
          - NAME: keycloak
            DOCKERFILE: infra/keycloak/Dockerfile
            CONTEXT: infra/keycloak
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
      variables:
        POSTGRES_USER: builder
        POSTGRES_PASSWORD: builder
        POSTGRES_DB: builder_e2e
    - name: $HARBOR_HOST/$HARBOR_PROJECT/keycloak:$CI_COMMIT_SHA
      alias: keycloak
      # Dev mode with an in-container database; the realm comes from the image.
      command: ["start-dev", "--import-realm"]
      variables:
        KC_DB: dev-file
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin
  variables:
    E2E_DATABASE_URL: postgres://builder:builder@postgres:5432/builder_e2e
  script:
    - pnpm turbo run build
    - DATABASE_URL="$E2E_DATABASE_URL" pnpm --filter @builder/db migrate
    # The browser, the Content API and the token issuer all expect Keycloak on localhost:8080.
    - node scripts/ci/forward-port.mjs 8080 keycloak:8080 &
    - node scripts/ci/wait-for.mjs http://localhost:8080/realms/builder/.well-known/openid-configuration 240
    - pnpm e2e
  artifacts:
    when: always
    expire_in: 14 days
    paths: [e2e/results]
